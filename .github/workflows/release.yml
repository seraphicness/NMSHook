name: Release

# Actions -> Release -> Run workflow -> enter a version (e.g. 0.1.0).
# Builds and tests, then creates the tag v<version> and a GitHub release with the plugin jar.
# The tag also makes the API available on JitPack: com.github.seraphicness.NMSHook:nmshook-api:v<version>
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without "v" (e.g. 0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check version format
        run: |
          [[ "${{ inputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]] \
            || { echo "Invalid version: ${{ inputs.version }}"; exit 1; }
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: ./gradlew build -PreleaseVersion=${{ inputs.version }} --no-daemon
      - name: Create tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ inputs.version }}" \
            "nmshook-plugin/build/libs/NMSHook-${{ inputs.version }}.jar" \
            "nmshook-api/build/libs/nmshook-api-${{ inputs.version }}.jar" \
            --target "${{ github.sha }}" \
            --title "NMSHook ${{ inputs.version }}" \
            --generate-notes
